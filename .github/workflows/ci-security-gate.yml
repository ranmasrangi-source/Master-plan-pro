name: 0 TO 8848 — CI, Security & Constitutional Gate

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

permissions:
  contents: read

jobs:
  constitutional-and-security-gate:
    name: Secret Scan, Type Check, Test Suite & Build Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Verify Single Lockfile (package-lock.json present, no bun.lock)
        run: test -f package-lock.json && test ! -f bun.lock

      - name: Install Dependencies (Deterministic Clean Install)
        run: npm ci

      - name: Step 1 — Secret & Constitutional Lock Scanner
        run: npm run security:scan

      - name: Step 2 — Dependency Vulnerability Audit (npm audit)
        run: npm run security:audit

      - name: Step 3 — Strict TypeScript Verification (tsc --noEmit)
        run: npm run lint

      - name: Step 4 — Automated Test Suite Execution
        run: npm test

      - name: Step 5 — Production Bundle & Build Integrity Check
        run: npm run build

      - name: Step 6 — Main Branch Protection Policy Audit (and Auto-Provision if Admin Token Present)
        env:
          BRANCH_PROTECTION_ADMIN_TOKEN: ${{ secrets.BRANCH_PROTECTION_ADMIN_TOKEN }}
        run: |
          if [ -n "$BRANCH_PROTECTION_ADMIN_TOKEN" ]; then
            npm run security:branch-protection -- --apply
          else
            npm run security:branch-protection
          fi
